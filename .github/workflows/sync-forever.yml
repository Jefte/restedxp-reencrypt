name: Sync Forever guides

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-forever-guides
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch, validate, and re-key the latest upstream payload
        run: npm run sync:forever:upstream:write
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run verify
      - name: Commit a validated update
        run: |
          if git diff --quiet -- public/guide_forever_player_1234.txt public/guide_forever_player_1234.metadata.json; then
            echo "Already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/guide_forever_player_1234.txt public/guide_forever_player_1234.metadata.json
          git commit -m "chore: sync Forever guide payload"
          git push origin HEAD:main
